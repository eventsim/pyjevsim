name: Test and behavioral validation

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 03:17 UTC: catches breakage from new runner images,
    # Python patch releases and dependency releases between pushes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # The published performance numbers were measured on Windows with
          # CPython 3.14, so that combination is tested too.
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . -r docs/hla-validation/requirements-validation.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify committed result artifacts
        run: python docs/hla-validation/results/verify_results.py
      - name: Verify standalone and two-federate equivalence
        run: python examples/hla_atsim/verify_equivalence.py

  min-deps:
    # Snapshot and restore tests against the lowest dill pyproject.toml
    # allows for each Python version. Keep this table in step with the
    # dill markers in pyproject.toml.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dill: "0.3.6"
          - python-version: "3.11"
            dill: "0.3.7"
          - python-version: "3.12"
            dill: "0.3.8"
          - python-version: "3.13"
            dill: "0.3.9"
          - python-version: "3.14"
            dill: "0.4.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package with the lowest supported dill
        run: |
          python -m pip install "dill==${{ matrix.dill }}" "pytest>=7"
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "import dill, sys; print('dill', dill.__version__); sys.exit(dill.__version__ != '${{ matrix.dill }}')"
      - name: Run snapshot and restore tests
        run: >-
          python -m pytest -q
          tests/test_behavior_snapshot.py tests/test_behavior_restore.py
          tests/test_structural_snapshot.py tests/test_structural_restore.py
          tests/test_simulation_snapshot.py tests/test_simulation_restore.py
          tests/test_system_object.py tests/test_lazy_imports.py
