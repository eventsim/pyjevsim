name: Trace oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # pyjevsim itself is not installed: the oracle imports it from each
      # checkout it runs, and asserts that it did.
      - name: Install oracle dependencies
        run: python -m pip install -r docs/hla-validation/requirements-validation.txt
      - name: Compare HEAD with the merge base and the v2.2.0 golden
        env:
          ORACLE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          ORACLE_ARGS: --no-slow
        # Compare with the branch the pull request targets (a stacked pull
        # request is measured against its own base); pushes use ORACLE_BASE.
        run: bash tools/oracle/ci_gate.sh "origin/${{ github.base_ref || 'main' }}"
