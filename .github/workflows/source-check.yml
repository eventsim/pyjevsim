name: Python source check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile package sources
        run: python -m compileall -q pyjevsim

  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install documentation and build tools
        run: python -m pip install -r requirements_docs.txt build twine
      - name: Install package
        run: python -m pip install .
      - name: Build documentation with warnings as errors
        run: sphinx-build -W -b html docs/source docs/build/html
      - name: Build and inspect distributions
        run: |
          python -m build --outdir dist/ci
          python -m twine check dist/ci/*
