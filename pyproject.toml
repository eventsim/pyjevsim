[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjevsim"
version = "2.2.0"
description = "Python DEVS modeling and simulation with journaling and pluggable HLA federate backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Changbeom Choi", email = "me@cbchoi.info" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
keywords = ["DEVS", "simulation", "discrete-event", "modeling", "HLA", "IEEE 1516"]
dependencies = ["dill>=0.3.6"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Java-backed HLA adapters. JPype>=1.6 needs Java>=11; pin jpype1<=1.5 for
# Java 8. The hla-pitch name remains for compatibility with earlier releases.
hla-java = ["jpype1>=1.5"]
hla-pitch = ["jpype1>=1.5"]

[project.urls]
Homepage = "https://github.com/eventsim/pyjevsim"
Documentation = "https://pyjevsim.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/eventsim/pyjevsim"
Issues = "https://github.com/eventsim/pyjevsim/issues"

[tool.setuptools.packages.find]
include = ["pyjevsim*"]
exclude = ["tests*", "examples*", "docs*", "venv*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
